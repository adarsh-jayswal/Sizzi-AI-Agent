<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Sizzi AI Agent</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <header class="auth-header">
    <span class="brand" aria-label="Sizzi AI Agent">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" stroke="var(--accent)" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="3.3" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand-name">Sizzi AI Agent</span>
    </span>
    <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Switch to light mode" title="Switch to light mode">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M13.6 3.5A6.8 6.8 0 0 0 8.2 16.3 7.3 7.3 0 0 1 13.6 3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <span class="auth-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" stroke="var(--accent)" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="3.4" fill="var(--accent)"/>
        </svg>
      </span>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue to Sizzi AI Agent.</p>

      <div class="auth-demo-note">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 4.6v3.4M7.5 10.4v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>Sign in to access your Sizzi AI Agent account.</span>
      </div>

      <div id="formBanner" class="auth-form-banner error" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="loginEmail">Email</label>
          <div class="field-input-wrap">
            <input class="field-input" type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <p class="field-error" id="loginEmailError"></p>
        </div>

        <div class="field-group">
          <label class="field-label" for="loginPassword">Password</label>
          <div class="field-input-wrap">
            <input class="field-input has-toggle" type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="field-toggle-visibility" data-toggle-for="loginPassword" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.6-4.6 7-4.6S15 8 15 8s-2.6 4.6-7 4.6S1 8 1 8Z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
          </div>
          <p class="field-error" id="loginPasswordError"></p>
        </div>

        <div class="field-row-between">
          <label class="checkbox-row">
            <input type="checkbox" id="rememberMe" />
            Remember me
          </label>
          <a class="field-link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="auth-submit" type="submit" id="loginSubmit">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.6" stroke-dasharray="28" stroke-dashoffset="10"/></svg>
          <span class="auth-submit-label">Sign In</span>
        </button>
      </form>
      <div class="auth-divider">OR</div>
      <p class="auth-footer-text">Don't have an account? <a href="signup.html">Create account</a></p>
    </div>
  </main>

<script src="js/auth.js"></script>
</body>
</html>
